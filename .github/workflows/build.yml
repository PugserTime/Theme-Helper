# Builds the Studio Theme native helper (studio_theme_qt.dll) on GitHub's
# Windows servers and PUBLISHES it as a GitHub Release.
#
# VERSION NUMBERS (automatic)
#   version = <BASE>.<BUILD>      e.g.  1.2.57
#   BASE    = the "major.minor" in main.cpp (#define STUDIO_THEME_HELPER_BASE).
#             The only part you edit by hand: bump it when the scripts need a
#             new feature from the helper.
#   BUILD   = this repo's commit count, so every commit gets a higher number and
#             nothing has to be edited. The same commit always gets the same one.
#   The version is compiled into the DLL (the mod's Settings tab shows it) and
#   becomes the release tag:  v<version>-abi<N>   e.g.  v1.2.57-abi5
#   (N = the RML_ABI_VERSION it was built for). The mod's updater compares these
#   numbers to decide whether an update exists.
#
# Download: repo page > "Releases". Each release has
#   studio_theme_qt.dll            (put it in  mods\studio_theme\native\)
#   studio_theme_qt_abi<N>.dll     (same file; what the in-mod updater downloads,
#                                   so it never picks a DLL built for another ABI)
#   studio_theme_helper_*.zip      (the RobloxModLoader folder layout)
# The newest one is also at .../releases/latest/download/studio_theme_qt.dll
# Only the NEWEST release per ABI is kept; older ones are removed automatically, so the Releases
# page never shows old versions. (Want a few for rollback? Raise KEEP_RELEASES below.)
#
# Auto-update: GitHub can't notify this repo when RML changes (it isn't your
# repo), so a tiny Linux job "watches" RML once an hour. It reads RML's latest
# ABI number (a few seconds, no build). Only when there is NO release for that
# ABI yet does it start the real Windows build - so a new ABI gets its DLL
# within about an hour, automatically, and every other hour costs nothing.
#
# Why it's fast:
#  * RML is compiled once and cached. The cache is keyed by the RML ABI and by
#    this runner's compiler version (a cached build points at absolute compiler
#    paths, so a new compiler needs a fresh one). Later runs recompile only
#    main.cpp - a few minutes.
#  * The cache is saved even when the helper fails to compile, so fixing a typo
#    in main.cpp never means recompiling RML again.
#  * Pushes only build when main.cpp or a workflow file changes (README edits
#    etc. don't trigger it). You can still start it by hand from the Actions tab.
#  * .NET is only installed when RML actually has to be compiled.

name: Build Studio Theme helper

on:
  push:
    branches: ["**"]
    paths:
      - "main.cpp"
      - "**/main.cpp"
      - ".github/workflows/*.yml"

  # The RML watcher. Runs the cheap check only; see the "detect" job.
  schedule:
    - cron: "23 * * * *"

  workflow_dispatch:
    inputs:
      rml_ref:
        description: "RML commit, tag, or branch. Leave empty for the latest RML."
        required: false
        type: string
        default: ""

# One build at a time, and never cancel one halfway: a cancelled first build
# would throw away the long RML compile before it could be cached.
concurrency:
  group: studio-theme-helper
  cancel-in-progress: false

permissions:
  contents: write # needed to publish the release
  actions: write  # lets the watcher keep its own schedule from being auto-disabled

env:
  RML_REPO: revolutionxk/roblox-modloader
  ABI_HEADER: code/roblox_modloader/include/RobloxModLoader/version.hpp

jobs:
  # ---------------------------------------------------------------------------
  # Cheap watcher (seconds, Linux). Decides whether a Windows build is needed.
  #  * push / manual run  -> always build (manual runs can pick an RML version)
  #  * hourly schedule    -> build only if no release exists for RML's latest ABI
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rml.outputs.sha }}
      abi: ${{ steps.rml.outputs.abi }}
      build: ${{ steps.decide.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_REF: ${{ inputs.rml_ref }}
    steps:
      # GitHub switches scheduled workflows off after 60 days without repo
      # activity. Re-enabling ourselves on every check keeps the watcher alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: gh workflow enable "${{ github.workflow }}" || true

      - name: Read RML's latest commit and ABI
        id: rml
        run: |
          REF="$REQUESTED_REF"
          [ -z "$REF" ] && REF="HEAD"
          SHA=$(gh api "repos/$RML_REPO/commits/$REF" --jq .sha)
          [ -n "$SHA" ] || { echo "Couldn't resolve RML ref '$REF'."; exit 1; }
          ABI=$(gh api "repos/$RML_REPO/contents/$ABI_HEADER?ref=$SHA" --jq .content \
            | base64 -d | grep -oE 'RML_ABI_VERSION[[:space:]]+[0-9]+' | grep -oE '[0-9]+$')
          [ -n "$ABI" ] || { echo "Couldn't read RML_ABI_VERSION at $SHA (did RML move version.hpp?)."; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "RML $SHA reports ABI $ABI"

      - name: Decide whether to build
        id: decide
        run: |
          BUILD=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # any release for this ABI counts: v1.2.57-abi5, or the old helper-abi5
            if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -qE -- "-abi${{ steps.rml.outputs.abi }}$"; then
              BUILD=false
              echo "A release for ABI ${{ steps.rml.outputs.abi }} already exists - nothing to do."
            else
              echo "RML ABI ${{ steps.rml.outputs.abi }} has no release yet - building."
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # The watcher already resolved this to an exact RML commit (the latest
      # one, or the one you typed for a manual run).
      RML_REF: ${{ needs.detect.outputs.sha }}
      # Bump to force a clean rebuild of RML.
      CACHE_VERSION: v4
      # for the gh CLI (release + api calls); GH_REPO because the checkout is
      # in ./kit, so the workspace root isn't a git repo
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Get this kit
        uses: actions/checkout@v4
        with:
          path: kit
          fetch-depth: 0 # full history: the commit count is the build number

      - name: Resolve RML commit and ABI
        id: rml
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = gh api "repos/$env:RML_REPO/commits/$env:RML_REF" --jq ".sha"
          if (-not $sha) {
            throw "Couldn't resolve RML ref '$env:RML_REF'."
          }
          $encodedHeader = gh api `
            "repos/$env:RML_REPO/contents/$env:ABI_HEADER`?ref=$sha" `
            --jq ".content"
          if (-not $encodedHeader) {
            throw "Couldn't download '$env:ABI_HEADER' from RML commit '$sha'."
          }
          $header = [System.Text.Encoding]::UTF8.GetString(
            [System.Convert]::FromBase64String(($encodedHeader -replace "\s", ""))
          )
          $match = [regex]::Match($header, "RML_ABI_VERSION\s+([0-9]+)")
          if (-not $match.Success) {
            throw "Couldn't find RML_ABI_VERSION in '$env:ABI_HEADER' at '$sha'."
          }
          $abi = $match.Groups[1].Value
          Write-Host "Requested RML ref: $env:RML_REF"
          Write-Host "Resolved RML SHA: $sha"
          Write-Host "RML ABI version: $abi"
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "abi=$abi" >> $env:GITHUB_OUTPUT
          exit 0

      # <BASE> from main.cpp + <commit count> = the version. Nothing to edit.
      - name: Work out the version number
        id: version
        shell: pwsh
        env:
          RML_ABI: ${{ steps.rml.outputs.abi }}
        run: |
          $ErrorActionPreference = "Stop"
          $main = Get-ChildItem kit -Recurse -Filter main.cpp -File |
            Where-Object { Select-String -Path $_.FullName -Pattern "studio_theme_qt" -Quiet } |
            Select-Object -First 1
          if (-not $main) {
            throw "Couldn't find main.cpp in your repo. Upload the helper main.cpp, then run this workflow again."
          }
          $m = Select-String -Path $main.FullName -Pattern '#define\s+STUDIO_THEME_HELPER_BASE\s+"(\d+\.\d+)"' | Select-Object -First 1
          if (-not $m) {
            throw 'main.cpp has no  #define STUDIO_THEME_HELPER_BASE "x.y"  line - the workflow needs it to build the version number.'
          }
          $base = $m.Matches[0].Groups[1].Value
          $count = (git -C kit rev-list --count HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $count) { throw "Couldn't count commits." }
          $version = "$base.$count"
          $tag = "v$version-abi$env:RML_ABI"
          Write-Host "Helper version: $version  (base $base, build $count)"
          Write-Host "Release tag:    $tag"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "main=$($main.FullName)" >> $env:GITHUB_OUTPUT
          exit 0

      # Compiler first: its version goes into the cache key below.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Identify the toolchain (for the cache key)
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Visual Studio ships Ninja and MSVC puts it on PATH; fall back to
          # Chocolatey (preinstalled on the runner) if it ever doesn't.
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            Write-Host "Ninja isn't on PATH - installing it."
            choco install ninja -y --no-progress | Out-Host
            "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
            $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          }
          $cl = (Get-Command cl -ErrorAction Stop).Source
          $ninja = (Get-Command ninja -ErrorAction Stop).Source
          $text = "$env:VCToolsVersion|$env:WindowsSDKVersion|$cl|$ninja"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
          $hash = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $id = ([System.BitConverter]::ToString($hash) -replace "-", "").Substring(0, 10).ToLower()
          Write-Host "Toolchain: $text"
          Write-Host "Toolchain id: $id"
          "id=$id" >> $env:GITHUB_OUTPUT
          exit 0

      # Restore and save are separate so the cache can be saved even when the
      # helper fails to compile (see "Save RML build cache").
      - name: Restore cached RML build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            rml
            !rml/.git
          key: rml-build-abi${{ steps.rml.outputs.abi }}-tc${{ steps.toolchain.outputs.id }}-${{ env.CACHE_VERSION }}

      - name: Report whether RML must be built
        shell: pwsh
        env:
          RML_ABI: ${{ steps.rml.outputs.abi }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if ($env:CACHE_HIT -eq "true") {
            Write-Host "Cache hit for ABI $env:RML_ABI - reusing the RML build, only recompiling the helper."
          } else {
            Write-Host "No cached build for ABI $env:RML_ABI on this toolchain - compiling RML (slow, happens once)."
          }
          exit 0

      - name: Get RML source (only when there is no cached build)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          RML_SHA: ${{ steps.rml.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          # Shallow: only the one commit, and submodules fetched in parallel.
          git init rml
          Set-Location rml
          git remote add origin "https://github.com/$env:RML_REPO.git"
          git fetch --depth 1 origin $env:RML_SHA
          if ($LASTEXITCODE -ne 0) { throw "Couldn't fetch RML $env:RML_SHA." }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Couldn't check out RML." }
          git submodule update --init --recursive --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Shallow submodules failed - retrying with full history."
            $global:LASTEXITCODE = 0
            git submodule update --init --recursive --jobs 8
            if ($LASTEXITCODE -ne 0) { throw "Couldn't fetch RML's submodules." }
          }
          exit 0

      # Copies main.cpp into RML's examples and puts the version on its first
      # line (#line 1 keeps compiler error line numbers matching your file).
      - name: Add the helper (with its version number)
        shell: pwsh
        env:
          MAIN: ${{ steps.version.outputs.main }}
          HELPER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Using $env:MAIN"
          New-Item -ItemType Directory -Force "rml/examples/studio_theme_qt" | Out-Null
          $head = [System.Text.Encoding]::ASCII.GetBytes("#define STUDIO_THEME_HELPER_VERSION `"$env:HELPER_VERSION`"`n#line 1`n")
          $body = [System.IO.File]::ReadAllBytes($env:MAIN)
          $dest = Join-Path (Get-Location) "rml/examples/studio_theme_qt/main.cpp"
          [System.IO.File]::WriteAllBytes($dest, [byte[]]($head + $body))
          exit 0

      # Only needed to configure RML's CMake, i.e. when compiling it fresh.
      - name: Set up .NET (only when compiling RML)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build helper
        id: build
        shell: pwsh
        working-directory: rml
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "build/build.ninja")) {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }
          }
          cmake --build build --parallel --target studio_theme_qt
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
          $dll = Get-ChildItem build -Recurse -Filter studio_theme_qt.dll -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dll) { throw "studio_theme_qt.dll wasn't built." }
          Write-Host "Built $($dll.FullName)"
          "dll=$($dll.FullName)" >> $env:GITHUB_OUTPUT
          exit 0

      # Runs even if the helper failed to compile: the (slow) RML part is done,
      # so keep it. Nothing to save on a cache hit.
      - name: Save RML build cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            rml
            !rml/.git
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The DLL must (1) report the RML ABI it was built for - rml_abi_version()
      # is  mov eax, <ABI>; ret  - and (2) contain the version string we injected.
      # (Searches a Latin-1 string: much faster than looping over the bytes.)
      - name: Verify the helper (ABI + version)
        shell: pwsh
        env:
          RML_ABI: ${{ steps.rml.outputs.abi }}
          HELPER_VERSION: ${{ steps.version.outputs.version }}
          DLL: ${{ steps.build.outputs.dll }}
        run: |
          $ErrorActionPreference = "Stop"
          $abi = [int]$env:RML_ABI
          $expected = [byte[]](
            0xB8,
            ($abi -band 0xFF),
            (($abi -shr 8) -band 0xFF),
            (($abi -shr 16) -band 0xFF),
            (($abi -shr 24) -band 0xFF),
            0xC3
          )
          $needle = -join ($expected | ForEach-Object { [char]$_ })
          $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($env:DLL))
          if (-not $text.Contains($needle)) {
            throw "The DLL does not appear to report RML_ABI_VERSION $abi. Refusing to publish it."
          }
          Write-Host "ABI check passed: studio_theme_qt.dll reports ABI $abi."
          if (-not $text.Contains($env:HELPER_VERSION)) {
            throw "The DLL doesn't contain version $env:HELPER_VERSION - the version injection didn't work. Refusing to publish it."
          }
          Write-Host "Version check passed: studio_theme_qt.dll reports $env:HELPER_VERSION."
          exit 0

      - name: Package
        shell: pwsh
        env:
          RML_SHA: ${{ steps.rml.outputs.sha }}
          RML_ABI: ${{ steps.rml.outputs.abi }}
          HELPER_VERSION: ${{ steps.version.outputs.version }}
          DLL: ${{ steps.build.outputs.dll }}
        run: |
          $ErrorActionPreference = "Stop"
          $nativePath = "out/RobloxModLoader/mods/studio_theme/native"
          New-Item -ItemType Directory -Force $nativePath, "dist" | Out-Null
          Copy-Item -Path $env:DLL -Destination "$nativePath/studio_theme_qt.dll" -Force
          Copy-Item -Path $env:DLL -Destination "dist/studio_theme_qt.dll" -Force
          # same bytes, ABI-specific name: what the in-mod updater downloads
          Copy-Item -Path $env:DLL -Destination "dist/studio_theme_qt_abi$env:RML_ABI.dll" -Force
          $install = @(
            "Studio Theme native helper $env:HELPER_VERSION",
            "Built for RML_ABI_VERSION: $env:RML_ABI",
            "Built against RML commit: $env:RML_SHA",
            "",
            "Close Studio, then copy the RobloxModLoader folder from this zip on top of",
            "your existing one:",
            "  ...\Roblox\Versions\version-xxxx\RobloxModLoader",
            "Choose Yes if Windows asks to replace files. Only studio_theme_qt.dll is included.",
            "",
            "If Studio's mod log says the helper was built for a different RML_ABI_VERSION",
            "than your loader, run the Build workflow again with your RML version."
          ) -join "`n"
          Set-Content -Path "out/INSTALL.txt" -Value $install -Encoding utf8
          Compress-Archive -Path "out/*" -DestinationPath "dist/studio_theme_helper_v$($env:HELPER_VERSION)_abi$env:RML_ABI.zip" -Force
          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name)  ($($_.Length) bytes)" }
          exit 0

      # One release per build, tagged v<version>-abi<N>. The in-mod updater reads
      # the version from the tag. The newest 5 per ABI are kept.
      - name: Publish release
        id: release
        shell: pwsh
        env:
          RML_SHA: ${{ steps.rml.outputs.sha }}
          RML_ABI: ${{ steps.rml.outputs.abi }}
          HELPER_VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          KEEP_RELEASES: "1" # how many releases to keep per ABI (newest first)
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:TAG
          $repo = $env:GITHUB_REPOSITORY
          $notes = @(
            "Native helper (studio_theme_qt.dll) $env:HELPER_VERSION for the Studio Theme mod.",
            "",
            "Built for RML_ABI_VERSION $env:RML_ABI, against RML commit $env:RML_SHA.",
            "Built from this repo at commit $env:GITHUB_SHA.",
            "",
            "Install (close Studio first), either:",
            "1) download studio_theme_qt.dll and put it in  RobloxModLoader\mods\studio_theme\native\",
            "2) or download the zip and copy its RobloxModLoader folder over your existing one.",
            "(studio_theme_qt_abi$env:RML_ABI.dll is the same file; it is what the in-mod updater downloads.)",
            "",
            "Direct link to the newest build:",
            "https://github.com/$repo/releases/latest/download/studio_theme_qt.dll",
            "",
            "If the mod log says the helper was built for a different RML_ABI_VERSION than your",
            "loader, run the Build workflow again with your RML version."
          ) -join "`n"
          Set-Content -Path "notes.md" -Value $notes -Encoding utf8

          $tags = @(gh release list --limit 200 --json tagName --jq ".[].tagName")
          if ($LASTEXITCODE -ne 0) { throw "Couldn't list releases (does the workflow have write access?)." }
          if ($tags -contains $tag) {
            # same version + ABI built again (e.g. a manual run): replace it
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Couldn't replace the previous $tag release." }
          }
          gh release create $tag `
            "dist/studio_theme_qt.dll" `
            "dist/studio_theme_qt_abi$env:RML_ABI.dll" `
            "dist/studio_theme_helper_v$($env:HELPER_VERSION)_abi$env:RML_ABI.zip" `
            --target $env:GITHUB_SHA `
            --title "Studio Theme helper $env:HELPER_VERSION (RML ABI $env:RML_ABI)" `
            --notes-file notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create the release." }

          $url = gh release view $tag --json url --jq ".url"
          Write-Host "Published: $url"
          @(
            "### Published helper $env:HELPER_VERSION",
            "",
            "Release: $url",
            "",
            "Newest build: https://github.com/$repo/releases/latest/download/studio_theme_qt.dll"
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

          # Keep only the newest release(s) for this ABI; remove older ones (and their tags).
          # Never fails the build: the new release is already published.
          $keep = [int]$env:KEEP_RELEASES
          if ($keep -lt 1) { $keep = 1 }
          try {
            $filter = "[.[] | select(.tagName | endswith(`"-abi$env:RML_ABI`"))] | sort_by(.createdAt) | reverse | .[].tagName"
            $mine = @(gh release list --limit 200 --json tagName,createdAt --jq $filter)
            foreach ($old in ($mine | Select-Object -Skip $keep)) {
              Write-Host "Removing old release $old"
              gh release delete $old --yes --cleanup-tag
            }
          } catch {
            Write-Warning "Couldn't tidy old releases: $_"
          }
          exit 0

      # Only if publishing failed (e.g. the repo forbids the workflow from
      # writing), so the DLL isn't lost.
      - name: Upload artifact (fallback)
        if: ${{ failure() && steps.release.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-theme-helper-abi${{ steps.rml.outputs.abi }}
          path: dist
          if-no-files-found: ignore
