# Builds ONLY the Studio Theme native helper (studio_theme_qt.dll) on GitHub's
# Windows servers. RML is compiled once (the helper has to link against it)
# and then cached, so later runs only recompile main.cpp - a few minutes.
#
# The selected RML commit's RML_ABI_VERSION is read automatically and included
# in the artifact name and INSTALL.txt.

name: Build Studio Theme helper

on:
  push:

  workflow_dispatch:
    inputs:
      rml_ref:
        description: "RML commit, tag, or branch (leave as default unless you need a specific version)"
        required: true
        type: string
        default: "9a4c803"

jobs:
  build:
    runs-on: windows-latest

    env:
      # `inputs.rml_ref` is set for manual runs. On a push, it is empty, so
      # this falls back to the same commit you were already using.
      RML_REF: ${{ inputs.rml_ref || '9a4c803' }}
      RML_REPO: revolutionxk/roblox-modloader
      ABI_HEADER: code/roblox_modloader/include/RobloxModLoader/version.hpp

    steps:
      - name: Get this kit
        uses: actions/checkout@v4
        with:
          path: kit

      - name: Resolve RML commit and ABI
        id: rml
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $sha = gh api "repos/$env:RML_REPO/commits/$env:RML_REF" --jq ".sha"

          if (-not $sha) {
            throw "Couldn't resolve RML ref '$env:RML_REF'."
          }

          $encodedHeader = gh api `
            "repos/$env:RML_REPO/contents/$env:ABI_HEADER`?ref=$sha" `
            --jq ".content"

          if (-not $encodedHeader) {
            throw "Couldn't download '$env:ABI_HEADER' from RML commit '$sha'."
          }

          $header = [System.Text.Encoding]::UTF8.GetString(
            [System.Convert]::FromBase64String(($encodedHeader -replace "\s", ""))
          )

          $match = [regex]::Match(
            $header,
            "RML_ABI_VERSION\s+([0-9]+)"
          )

          if (-not $match.Success) {
            throw "Couldn't find RML_ABI_VERSION in '$env:ABI_HEADER' at '$sha'."
          }

          $abi = $match.Groups[1].Value

          Write-Host "Requested RML ref: $env:RML_REF"
          Write-Host "Resolved RML SHA: $sha"
          Write-Host "RML ABI version: $abi"

          "sha=$sha" >> $env:GITHUB_OUTPUT
          "abi=$abi" >> $env:GITHUB_OUTPUT

      # Restores RML's source + compiled objects from the last run. File
      # timestamps are kept, so Ninja only rebuilds what changed (main.cpp).
      # Bump "v3" to force a clean rebuild.
      - name: Restore cached RML build
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            rml
            !rml/.git
          key: rml-build-${{ steps.rml.outputs.sha }}-v3

      - name: Get RML source (first run only)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # This must be a normal URL, not [URL](URL) Markdown formatting.
          git clone https://github.com/revolutionxk/roblox-modloader.git rml

          Set-Location rml
          git checkout ${{ steps.rml.outputs.sha }}
          git submodule update --init --recursive

      - name: Add the helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $main = Get-ChildItem kit -Recurse -Filter main.cpp -File |
            Where-Object {
              Select-String -Path $_.FullName -Pattern "studio_theme_qt" -Quiet
            } |
            Select-Object -First 1

          if (-not $main) {
            throw "Couldn't find main.cpp in your repo. Upload the helper main.cpp, then run this workflow again."
          }

          Write-Host "Using $($main.FullName)"

          New-Item `
            -ItemType Directory `
            -Force `
            "rml/examples/studio_theme_qt" |
            Out-Null

          Copy-Item `
            -Path $main.FullName `
            -Destination "rml/examples/studio_theme_qt/main.cpp" `
            -Force

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build helper
        shell: pwsh
        working-directory: rml
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "build/build.ninja")) {
            cmake `
              -B build `
              -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_C_COMPILER=cl `
              -DCMAKE_CXX_COMPILER=cl
          }

          cmake `
            --build build `
            --parallel `
            --target studio_theme_qt

      # Ensures the generated DLL contains the expected implementation of
      # rml_abi_version(): mov eax, <ABI>; ret.
      - name: Verify helper ABI
        shell: pwsh
        env:
          RML_ABI: ${{ steps.rml.outputs.abi }}
        run: |
          $ErrorActionPreference = "Stop"

          $dll = Get-ChildItem `
            "rml/build" `
            -Recurse `
            -Filter "studio_theme_qt.dll" `
            -File |
            Select-Object -First 1

          if (-not $dll) {
            throw "studio_theme_qt.dll wasn't built."
          }

          $abi = [int]$env:RML_ABI
          $expected = [byte[]](
            0xB8,
            ($abi -band 0xFF),
            (($abi -shr 8) -band 0xFF),
            (($abi -shr 16) -band 0xFF),
            (($abi -shr 24) -band 0xFF),
            0xC3
          )

          $data = [System.IO.File]::ReadAllBytes($dll.FullName)
          $found = $false

          for ($i = 0; $i -le $data.Length - $expected.Length; $i++) {
            $matches = $true

            for ($j = 0; $j -lt $expected.Length; $j++) {
              if ($data[$i + $j] -ne $expected[$j]) {
                $matches = $false
                break
              }
            }

            if ($matches) {
              $found = $true
              break
            }
          }

          if (-not $found) {
            throw "The DLL does not appear to report RML_ABI_VERSION $abi. Refusing to package it."
          }

          Write-Host "ABI check passed: studio_theme_qt.dll reports ABI $abi."

      - name: Package
        shell: pwsh
        env:
          RML_SHA: ${{ steps.rml.outputs.sha }}
          RML_ABI: ${{ steps.rml.outputs.abi }}
        run: |
          $ErrorActionPreference = "Stop"

          $nativePath = "out/RobloxModLoader/mods/studio_theme/native"

          New-Item `
            -ItemType Directory `
            -Force `
            $nativePath |
            Out-Null

          $helper = Get-ChildItem `
            "rml/build" `
            -Recurse `
            -Filter "studio_theme_qt.dll" `
            -File |
            Select-Object -First 1

          if (-not $helper) {
            throw "studio_theme_qt.dll wasn't built."
          }

          Copy-Item `
            -Path $helper.FullName `
            -Destination "$nativePath/studio_theme_qt.dll" `
            -Force

          @"
          Studio Theme native helper

          Built for RML_ABI_VERSION: $env:RML_ABI
          Built against RML commit: $env:RML_SHA

          Close Studio, then copy the RobloxModLoader folder from this artifact
          on top of your existing one:

            ...\Roblox\Versions\version-xxxx\RobloxModLoader

          Choose Yes if Windows asks to replace files. Only studio_theme_qt.dll
          is included.

          If Studio's mod log says the helper was built against
          RML_ABI_VERSION=X but your loader is RML_ABI_VERSION=Y, run this
          workflow again using the RML version that matches your installed loader.
          "@ | Set-Content "out/INSTALL.txt" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-theme-helper-abi${{ steps.rml.outputs.abi }}
          path: out
          if-no-files-found: error
