# Builds the Studio Theme native helper (studio_theme_qt.dll) on GitHub's
# Windows servers and publishes it as a Release named after RML's ABI number.
#
# Why "by ABI": RML refuses a native mod unless the number the DLL was built
# with (RML_ABI_VERSION) exactly matches the loader's. RML only raises that
# number when the mod-facing C++ layout changes, so ONE build per ABI number
# works on every RML build that has that number. This workflow therefore:
#
#   * every 6 hours, looks at RML's latest commit and reads its ABI number;
#   * if there is no Release "abi-<N>" yet, builds the helper and publishes it;
#   * otherwise does nothing (no wasted build minutes).
#
# You can also run it by hand (Actions > Build Studio Theme helper > Run
# workflow) to build against a specific RML commit, e.g. an older ABI, or to
# force a rebuild. Pushing a change to main.cpp rebuilds too.
name: Build Studio Theme helper

on:
  push:
    paths:
      - "studio_theme_helper_kit/**"
      - "**/main.cpp"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      rml_ref:
        description: "RML commit / branch to build against. Leave empty for the latest."
        required: false
        default: ""
      force:
        description: "Rebuild even if a Release for this ABI already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-studio-theme-helper
  cancel-in-progress: false

env:
  RML_REPO: revolutionxk/roblox-modloader
  ABI_HEADER: code/roblox_modloader/include/RobloxModLoader/version.hpp

jobs:
  detect:
    name: Check RML's ABI
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rml.outputs.sha }}
      abi: ${{ steps.rml.outputs.abi }}
      build: ${{ steps.decide.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve RML commit and read its ABI number
        id: rml
        run: |
          REF="${{ github.event.inputs.rml_ref }}"
          [ -z "$REF" ] && REF="HEAD"
          SHA=$(gh api "repos/$RML_REPO/commits/$REF" --jq .sha)
          [ -n "$SHA" ] || { echo "Couldn't resolve RML ref '$REF'"; exit 1; }
          ABI=$(gh api "repos/$RML_REPO/contents/$ABI_HEADER?ref=$SHA" --jq .content | base64 -d | grep -oE 'RML_ABI_VERSION[[:space:]]+[0-9]+' | grep -oE '[0-9]+$')
          [ -n "$ABI" ] || { echo "Couldn't read RML_ABI_VERSION at $SHA (did RML move version.hpp?)"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "RML $SHA -> ABI $ABI"

      - name: Decide whether to build
        id: decide
        run: |
          BUILD=true
          # Scheduled runs only build when this ABI has no Release yet.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if gh release view "abi-${{ steps.rml.outputs.abi }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              BUILD=false
              echo "Release abi-${{ steps.rml.outputs.abi }} already exists - nothing to do."
            else
              echo "New ABI ${{ steps.rml.outputs.abi }} detected - building."
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            : # manual runs always build; "force" only matters for documentation
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    name: Build helper (ABI ${{ needs.detect.outputs.abi }})
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: windows-latest
    env:
      RML_SHA: ${{ needs.detect.outputs.sha }}
      RML_ABI: ${{ needs.detect.outputs.abi }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get this kit
        uses: actions/checkout@v4
        with:
          path: kit

      # RML's source + compiled objects are cached per RML commit, so re-running
      # for the same commit (e.g. after editing main.cpp) only recompiles main.cpp.
      - name: Restore cached RML build
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            rml
            !rml/.git
          key: rml-build-${{ env.RML_SHA }}-v3

      - name: Get RML source (when not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/${{ env.RML_REPO }}.git rml
          cd rml
          git checkout $env:RML_SHA
          git submodule update --init --recursive

      - name: Add the helper
        shell: pwsh
        run: |
          $main = Get-ChildItem kit -Recurse -Filter main.cpp -File |
            Where-Object { Select-String -Path $_.FullName -Pattern 'studio_theme_qt' -Quiet } |
            Select-Object -First 1
          if (-not $main) { throw "Couldn't find main.cpp in your repo. Upload the main.cpp file (Add file > Upload files), then run this again." }
          Write-Host "Using $($main.FullName)"
          New-Item -ItemType Directory -Force rml/examples/studio_theme_qt | Out-Null
          Copy-Item $main.FullName rml/examples/studio_theme_qt/main.cpp -Force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: seanmiddleditch/gha-setup-ninja@master

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build helper
        shell: pwsh
        working-directory: rml
        run: |
          if (-not (Test-Path build/build.ninja)) {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          }
          cmake --build build --parallel --target studio_theme_qt

      # Safety net: the DLL must report exactly the ABI number we detected,
      # otherwise RML would reject it. (rml_abi_version compiles to
      # "mov eax, N ; ret" = B8 <N as 4 bytes> C3.)
      - name: Verify the DLL reports ABI ${{ needs.detect.outputs.abi }}
        shell: pwsh
        run: |
          $dll = Get-ChildItem rml/build -Recurse -Filter studio_theme_qt.dll | Select-Object -First 1
          if (-not $dll) { throw "studio_theme_qt.dll wasn't built" }
          $code = @'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          abi = int(sys.argv[2])
          sys.exit(0 if b"\xb8" + struct.pack("<I", abi) + b"\xc3" in data else 1)
          '@
          $code | python - $dll.FullName $env:RML_ABI
          if ($LASTEXITCODE -ne 0) { throw "Built DLL does not report ABI $env:RML_ABI - not publishing it." }
          Write-Host "OK: DLL reports ABI $env:RML_ABI"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "out/RobloxModLoader/mods/studio_theme/native" | Out-Null
          $helper = Get-ChildItem rml/build -Recurse -Filter studio_theme_qt.dll | Select-Object -First 1
          Copy-Item $helper.FullName "out/RobloxModLoader/mods/studio_theme/native/"
          Copy-Item $helper.FullName "studio_theme_qt.dll"
          Set-Content out/INSTALL.txt @"
          Studio Theme native helper - built for RML_ABI_VERSION $env:RML_ABI
          (RML commit $env:RML_SHA)

          Close Studio, then copy the RobloxModLoader folder from this zip on top of
          your existing one:  ...\Roblox\Versions\version-xxxx\RobloxModLoader
          (say Yes to replace). Only studio_theme_qt.dll is inside.

          If Studio's mod log says the helper "was built against RML_ABI_VERSION=X but
          the loader is RML_ABI_VERSION=Y", download the Release named abi-Y instead.
          "@
          Compress-Archive -Path out/RobloxModLoader, out/INSTALL.txt -DestinationPath "studio-theme-helper-abi$env:RML_ABI.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: studio-theme-helper-abi${{ env.RML_ABI }}
          path: out

      - name: Publish Release abi-${{ needs.detect.outputs.abi }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "abi-$env:RML_ABI"
          $zip = "studio-theme-helper-abi$env:RML_ABI.zip"
          $repo = $env:RML_REPO

          $notes = "Studio Theme native helper for RML_ABI_VERSION $env:RML_ABI (built against RML $env:RML_SHA). Download the zip, close Studio, and copy the RobloxModLoader folder over yours."

          if ([string]::IsNullOrWhiteSpace($repo)) {
              throw "RML_REPO is not set"
          }

          if (-not (Test-Path $zip)) {
              throw "Release zip not found: $zip"
          }

          if (-not (Test-Path "studio_theme_qt.dll")) {
              throw "DLL not found: studio_theme_qt.dll"
          }

          Write-Host "Publishing Studio Theme helper..."
          Write-Host "Repository: $repo"
          Write-Host "Release:    $tag"
          Write-Host "ZIP:        $zip"
          Write-Host "DLL:        studio_theme_qt.dll"

          # Check whether the release already exists.
          # --repo is required because the checkout lives in ./kit,
          # not in the current working directory.
          gh release view $tag --repo $repo 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
              Write-Host "Release $tag already exists. Uploading assets..."

              gh release upload `
                  $tag `
                  $zip `
                  studio_theme_qt.dll `
                  --repo $repo `
                  --clobber

              if ($LASTEXITCODE -ne 0) {
                  throw "Uploading release assets failed"
              }

              Write-Host "Assets uploaded successfully."

              gh release edit `
                  $tag `
                  --repo $repo `
                  --notes "$notes"

              if ($LASTEXITCODE -ne 0) {
                  throw "Updating release notes failed"
              }

              Write-Host "Release notes updated successfully."
          }
          else {
              Write-Host "Release $tag does not exist. Creating it..."

              gh release create `
                  $tag `
                  $zip `
                  studio_theme_qt.dll `
                  --repo $repo `
                  --title "Helper for RML ABI $env:RML_ABI" `
                  --notes "$notes"

              if ($LASTEXITCODE -ne 0) {
                  throw "Creating release failed"
              }

              Write-Host "Release created successfully."
          }

          Write-Host ""
          Write-Host "Release publishing completed successfully."
          Write-Host "https://github.com/$repo/releases/tag/$tag"
