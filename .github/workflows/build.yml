# Builds ONLY the Studio Theme native helper (studio_theme_qt.dll) on GitHub's
# Windows servers. RML is compiled once (the helper has to link against it)
# and then cached, so later runs only recompile main.cpp - a few minutes.
name: Build Studio Theme helper

on:
  push:
  workflow_dispatch:
    inputs:
      rml_ref:
        description: "Your RML version (first line of your RML log, e.g. 17589c0)"
        required: true
        default: "17589c0"

jobs:
  build:
    runs-on: windows-latest
    env:
      RML_REF: ${{ github.event.inputs.rml_ref || '17589c0' }}
    steps:
      - name: Get this kit
        uses: actions/checkout@v4
        with:
          path: kit

      # Restores RML's source + compiled objects from the last run. File
      # timestamps are kept, so Ninja only rebuilds what changed (main.cpp).
      # Bump "v1" to force a clean rebuild.
      - name: Restore cached RML build
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            rml
            !rml/.git
          key: rml-build-${{ env.RML_REF }}-v1

      - name: Get RML source (first run only)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/revolutionxk/roblox-modloader.git rml
          cd rml
          git checkout $env:RML_REF
          git submodule update --init --recursive

      - name: Add the helper
        shell: pwsh
        run: |
          $main = Get-ChildItem kit -Recurse -Filter main.cpp -File |
            Where-Object { Select-String -Path $_.FullName -Pattern 'studio_theme_qt' -Quiet } |
            Select-Object -First 1
          if (-not $main) { throw "Couldn't find main.cpp in your repo. Upload the main.cpp file (Add file > Upload files), then run this again." }
          Write-Host "Using $($main.FullName)"
          New-Item -ItemType Directory -Force rml/examples/studio_theme_qt | Out-Null
          Copy-Item $main.FullName rml/examples/studio_theme_qt/main.cpp -Force

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: seanmiddleditch/gha-setup-ninja@master

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build helper
        shell: pwsh
        working-directory: rml
        run: |
          if (-not (Test-Path build/build.ninja)) {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          }
          cmake --build build --parallel --target studio_theme_qt

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "out/RobloxModLoader/mods/studio_theme/native" | Out-Null
          $helper = Get-ChildItem rml/build -Recurse -Filter studio_theme_qt.dll | Select-Object -First 1
          if (-not $helper) { throw "studio_theme_qt.dll wasn't built" }
          Copy-Item $helper.FullName "out/RobloxModLoader/mods/studio_theme/native/"
          Set-Content out/INSTALL.txt @"
          Close Studio, then copy the RobloxModLoader folder from this zip on top of
          your existing one:  ...\Roblox\Versions\version-xxxx\RobloxModLoader
          (say Yes to replace). Only studio_theme_qt.dll is inside.
          "@

      - uses: actions/upload-artifact@v4
        with:
          name: studio-theme-helper
          path: out
