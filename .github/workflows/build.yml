name: Build Studio Theme helper

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "main.cpp"
      - "**/main.cpp"
      - ".github/workflows/*.yml"

  # The RML watcher. Runs the cheap check only; see the "detect" job.
  schedule:
    - cron: "23 * * * *"

  workflow_dispatch:
    inputs:
      rml_ref:
        description: "RML commit, tag, or branch. Leave empty for the latest RML."
        required: false
        type: string
        default: ""
      version:
        description: "Helper version (X.Y.Z). Leave empty to use the newest existing helper version."
        required: false
        type: string
        default: ""

# One build at a time, and never cancel one halfway: a cancelled first build
# would throw away the long RML compile before it could be cached.
concurrency:
  group: studio-theme-helper
  cancel-in-progress: false

permissions:
  contents: write # needed to publish the release
  actions: write  # lets the watcher keep its own schedule from being auto-disabled

env:
  RML_REPO: revolutionxk/roblox-modloader
  ABI_HEADER: code/roblox_modloader/include/RobloxModLoader/version.hpp

jobs:
  # ---------------------------------------------------------------------------
  # Cheap watcher (seconds, Linux). Decides whether a Windows build is needed.
  #   * push / manual run  -> always build (manual runs can pick an RML version)
  #   * hourly schedule    -> build only if no release exists for RML's latest ABI
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rml.outputs.sha }}
      abi: ${{ steps.rml.outputs.abi }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_REF: ${{ inputs.rml_ref }}
    steps:
      # GitHub switches scheduled workflows off after 60 days without repo
      # activity. Re-enabling ourselves on every check keeps the watcher alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: gh workflow enable "${{ github.workflow }}" || true

      - name: Read RML's latest commit and ABI
        id: rml
        run: |
          REF="$REQUESTED_REF"
          [ -z "$REF" ] && REF="HEAD"
          SHA=$(gh api "repos/$RML_REPO/commits/$REF" --jq .sha)
          [ -n "$SHA" ] || { echo "Couldn't resolve RML ref '$REF'."; exit 1; }
          ABI=$(gh api "repos/$RML_REPO/contents/$ABI_HEADER?ref=$SHA" --jq .content \
            | base64 -d | grep -oE 'RML_ABI_VERSION[[:space:]]+[0-9]+' | grep -oE '[0-9]+$')
          [ -n "$ABI" ] || { echo "Couldn't read RML_ABI_VERSION at $SHA (did RML move version.hpp?)."; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "RML $SHA reports ABI$ABI"

      - name: Determine helper version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="$REQUESTED_VERSION"

          # A pushed vX.Y.Z tag is the explicit helper version.
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Scheduled/new-ABI builds inherit the newest existing helper
          # version so an ABI bump doesn't accidentally reset the version.
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | \
              grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | \
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
              sort -V | tail -1 | sed 's/^v//') || true
          fi

          # First-ever release fallback.
          [ -n "$VERSION" ] || VERSION="1.0.0"

          if ! printf '%s' "$VERSION" \vert{} grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid helper version '$VERSION'. Expected X.Y.Z."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Helper version: $VERSION"

      - name: Decide whether to build
        id: decide
        run: |
          BUILD=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="helper-abi${{ steps.rml.outputs.abi }}-v${{ steps.version.outputs.version }}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              BUILD=false
              echo "Release $TAG already exists - nothing to do."
            else
              echo "Release $TAG does not exist - building."
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      RML_REF: ${{ needs.detect.outputs.sha }}
      HELPER_VERSION: ${{ needs.detect.outputs.version }}
      CACHE_VERSION: v4
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Get this kit
        uses: actions/checkout@v4
        with:
          path: kit

      - name: Resolve RML commit and ABI
        id: rml
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = gh api "repos/$env:RML_REPO/commits/$env:RML_REF" --jq ".sha"
          if (-not $sha) {
            throw "Couldn't resolve RML ref '$env:RML_REF'."
          }
          $encodedHeader = gh api "repos/$env:RML_REPO/contents/$env:ABI_HEADER?ref=$sha" --jq ".content"
          if (-not $encodedHeader) {
            throw "Couldn't download '$env:ABI_HEADER' from RML commit '$sha'."
          }
          $header = [System.Text.Encoding]::UTF8.GetString(
            [System.Convert]::FromBase64String(($encodedHeader -replace "\s", ""))
          )
          $match = [regex]::Match($header, "RML_ABI_VERSION\s+([0-9]+)")
          if (-not $match.Success) {
            throw "Couldn't find RML_ABI_VERSION in '$env:ABI_HEADER' at '$sha'."
          }
          $abi =$match.Groups[1].Value
          Write-Host "Requested RML ref: $env:RML_REF"
          Write-Host "Resolved RML SHA: $sha"
          Write-Host "RML ABI version: $abi"
          "sha=$sha" \vert{} Add-Content -Path $env:GITHUB_OUTPUT
          "abi=$abi" \vert{} Add-Content -Path $env:GITHUB_OUTPUT

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Identify the toolchain (for the cache key)
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            Write-Host "Ninja isn't on PATH - installing it."
            choco install ninja -y --no-progress | Out-Host
            "C:\ProgramData\chocolatey\bin" | Add-Content -Path $env:GITHUB_PATH
            $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          }
          $cl = (Get-Command cl -ErrorAction Stop).Source
          $ninja = (Get-Command ninja -ErrorAction Stop).Source
          $text = "$env:VCToolsVersion\vert{}$env:WindowsSDKVersion|$cl\vert{}$ninja"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
          $hash = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $id = ([System.BitConverter]::ToString($hash) -replace "-", "").Substring(0, 10).ToLower()
          Write-Host "Toolchain: $text"
          Write-Host "Toolchain id: $id"
          "id=$id" \vert{} Add-Content -Path $env:GITHUB_OUTPUT

      - name: Restore cached RML build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            rml
            !rml/.git
          key: rml-build-abi${{ steps.rml.outputs.abi }}-tc${{ steps.toolchain.outputs.id }}-${{ env.CACHE_VERSION }}

      - name: Report whether RML must be built
        shell: pwsh
        env:
          RML_ABI: ${{ steps.rml.outputs.abi }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if ($env:CACHE_HIT -eq "true") {
            Write-Host "Cache hit for ABI $env:RML_ABI - reusing the RML build, only recompiling the helper."
          } else {
            Write-Host "No cached build for ABI $env:RML_ABI on this toolchain - compiling RML (slow, happens once)."
          }

      - name: Get RML source (only when there is no cached build)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          RML_SHA: ${{ steps.rml.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          git init rml
          Set-Location rml
          git remote add origin "https://github.com/$env:RML_REPO.git"
          git fetch --depth 1 origin $env:RML_SHA
          if ($LASTEXITCODE -ne 0) { throw "Couldn't fetch RML $env:RML_SHA." }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Couldn't check out RML." }
          git submodule update --init --recursive --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Shallow submodules failed - retrying with full history."
            $global:LASTEXITCODE = 0
            git submodule update --init --recursive --jobs 8
            if ($LASTEXITCODE -ne 0) { throw "Couldn't fetch RML's submodules." }
          }

      - name: Add the helper
        shell: pwsh
        env:
          HELPER_VERSION: ${{ needs.detect.outputs.version }}
          RML_ABI: ${{ steps.rml.outputs.abi }}
        run: |
          $ErrorActionPreference = "Stop"
          $main = Get-ChildItem kit -Recurse -Filter main.cpp -File |
            Where-Object {
              Select-String -Path $_.FullName -Pattern "studio_theme_qt" -Quiet
            } |
            Select-Object -First 1
          if (-not $main) {
            throw "Couldn't find main.cpp in your repo. Upload the helper main.cpp, then run this workflow again."
          }
          Write-Host "Using $($main.FullName)"
          New-Item -ItemType Directory -Force "rml/examples/studio_theme_qt" | Out-Null

          $source = Get-Content -Raw -Path$main.FullName
          $prefix = @"
#define STUDIO_THEME_VERSION "$env:HELPER_VERSION"
#define STUDIO_THEME_ABI $env:RML_ABI

"@
          Set-Content -Path "rml/examples/studio_theme_qt/main.cpp" -Value ($prefix +$source) -Encoding utf8

      - name: Set up .NET (only when compiling RML)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build helper
        id: build
        shell: pwsh
        working-directory: rml
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "build/build.ninja")) {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }
          }
          cmake --build build --parallel --target studio_theme_qt
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
          $dll = Get-ChildItem build -Recurse -Filter studio_theme_qt.dll -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dll) { throw "studio_theme_qt.dll wasn't built." }
          Write-Host "Built $($dll.FullName)"
          "dll=$($dll.FullName)" \vert{} Add-Content -Path $env:GITHUB_OUTPUT

      - name: Save RML build cache
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            rml
            !rml/.git
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Verify helper ABI
        shell: pwsh
        env:
          RML_ABI: ${{ steps.rml.outputs.abi }}
          DLL: ${{ steps.build.outputs.dll }}
        run: |
          $ErrorActionPreference = "Stop"
          $abi = [int]$env:RML_ABI
          $expected = [byte[]](             0xB8,             ($abi -band 0xFF),
            (($abi -shr 8) -band 0xFF),             (($abi -shr 16) -band 0xFF),
            (($abi -shr 24) -band 0xFF),             0xC3           )$needle = -join ($expected \vert{} ForEach-Object { [char]$_ })
          $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($env:DLL))
          if (-not $text.Contains($needle)) {
            throw "The DLL does not appear to report RML_ABI_VERSION $abi. Refusing to publish it."
          }
          Write-Host "ABI check passed: studio_theme_qt.dll reports ABI $abi."

      - name: Package
        shell: pwsh
        env:
          RML_SHA: ${{ steps.rml.outputs.sha }}
          RML_ABI: ${{ steps.rml.outputs.abi }}
          HELPER_VERSION: ${{ needs.detect.outputs.version }}
          DLL: ${{ steps.build.outputs.dll }}
        run: |
          $ErrorActionPreference = "Stop"
          $nativePath = "out/RobloxModLoader/mods/studio_theme/native"
          New-Item -ItemType Directory -Force $nativePath, "dist" | Out-Null
          Copy-Item -Path $env:DLL -Destination "$nativePath/studio_theme_qt.dll" -Force
          Copy-Item -Path $env:DLL -Destination "dist/studio_theme_qt.dll" -Force
          $install = @(
            "Studio Theme native helper",
            "Built for RML_ABI_VERSION: $env:RML_ABI",
            "Built against RML commit: $env:RML_SHA",
            "",
            "Close Studio, then copy the RobloxModLoader folder from this zip on top of",
            "your existing one:",
            "  ...\Roblox\Versions\version-xxxx\RobloxModLoader",
            "Choose Yes if Windows asks to replace files. Only studio_theme_qt.dll is included.",
            "",
            "If Studio's mod log says the helper was built for a different RML_ABI_VERSION",
            "than your loader, run the Build workflow again with your RML version."
          ) -join "`n"
          Set-Content -Path "out/INSTALL.txt" -Value $install -Encoding utf8
          Compress-Archive -Path "out/*" -DestinationPath "dist/studio_theme_helper_abi$env:RML_ABI-v$env:HELPER_VERSION.zip" -Force
          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name)  ($($_.Length) bytes)" }

      - name: Publish release
        id: release
        shell: pwsh
        env:
          RML_SHA: ${{ steps.rml.outputs.sha }}
          RML_ABI: ${{ steps.rml.outputs.abi }}
          HELPER_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "helper-abi$env:RML_ABI-v$env:HELPER_VERSION"
          $repo =$env:GITHUB_REPOSITORY
          $notes = @(
            "Native helper (studio_theme_qt.dll) for the Studio Theme mod.",
            "",
            "Helper version: $env:HELPER_VERSION.",
            "Built for RML_ABI_VERSION $env:RML_ABI, against RML commit$env:RML_SHA.",
            "Built from this repo at commit $env:GITHUB_SHA.",
            "",
            "Install (close Studio first), either:",
            "1) download studio_theme_qt.dll and put it in  RobloxModLoader\mods\studio_theme\native\",
            "2) or download the zip and copy its RobloxModLoader folder over your existing one.",
            "",
            "Direct link (always the newest build for this ABI):",
            "https://github.com/$repo/releases/download/$tag/studio_theme_qt.dll",
            "",
            "If the mod log says the helper was built for a different RML_ABI_VERSION than your",
            "loader, run the Build workflow again with your RML version."
          ) -join "`n"
          Set-Content -Path "notes.md" -Value $notes -Encoding utf8

          $tags = @(gh release list --limit 200 --json tagName --jq ".[].tagName")
          if ($LASTEXITCODE -ne 0) { throw "Couldn't list releases (does the workflow have write access?)." }
          if ($tags -contains $tag) {
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Couldn't replace the previous $tag release." }
          }
          gh release create $tag "dist/studio_theme_qt.dll" "dist/studio_theme_helper_abi$env:RML_ABI-v$env:HELPER_VERSION.zip" --target $env:GITHUB_SHA --title "Studio Theme helper (RML ABI $env:RML_ABI)" --notes-file notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create the release." }

          $url = gh release view $tag --json url --jq ".url"
          Write-Host "Published: $url"
          @(
            "### Published",
            "",
            "Release: $url",
            "",
            "Direct download: https://github.com/$repo/releases/download/$tag/studio_theme_qt.dll"
          ) -join "`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact (fallback)
        if: ${{ failure() && steps.release.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-theme-helper-abi${{ steps.rml.outputs.abi }}-v${{ needs.detect.outputs.version }}
          path: dist
          if-no-files-found: ignore
